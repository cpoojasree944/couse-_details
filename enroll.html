<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Register your interest in a TechZentra learning program."><title>Enroll | TechZentra</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="js/site.js" defer></script></head>
<body><header id="site-header"></header><main><section class="page-hero"><div class="container"><p class="eyebrow">TAKE THE NEXT STEP</p><h1>Start your <span>learning journey.</span></h1><p>Register your interest in a program. This demo confirms your selection on this page only; it does not send or store your personal information.</p></div></section><section class="enroll-section"><div class="container"><div class="enroll-card"><h2>Register your interest</h2><p>Choose a program and learning format to see your enrollment confirmation.</p><form class="enroll-form" data-enrollment-form><div class="form-field"><label for="enroll-name">Your name</label><input id="enroll-name" name="name" autocomplete="name" required></div><div class="form-field"><label for="enroll-email">Email address</label><input id="enroll-email" name="email" type="email" autocomplete="email" required></div><div class="form-field"><label for="enroll-course">Program</label><select id="enroll-course" name="course" required><option value="">Choose a program</option></select></div><div class="form-field"><label for="enroll-mode">Learning format</label><select id="enroll-mode" name="mode" required><option value="">Choose a format</option><option>College Learning</option><option>Online Learning</option><option>Offline Learning</option></select></div><div class="form-field full"><label for="enroll-message">Anything else you'd like us to know? (optional)</label><textarea id="enroll-message" name="message"></textarea></div><button class="button button-primary" type="submit">Submit interest <span aria-hidden="true">↗</span></button><p class="form-status full" role="status" aria-live="polite"></p></form></div></div></section></main><footer id="site-footer"></footer></body></html>
